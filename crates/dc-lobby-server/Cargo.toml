[package]
name = "dc-lobby-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "DeCombat lobby/auth server core (2009 EU client protocol, ROM model)"

[[bin]]
name = "dc-lobby-server"
path = "src/main.rs"

[dependencies]
dc-rom = { path = "../dc-rom" }
dc-rez = { path = "../dc-rez" }
dc-bute = { path = "../dc-bute" }
dc-wire = { path = "../dc-wire" }
dc-mod-lua = { path = "../dc-mod-lua" }
# CLEANROOM.md 4a: SQLite for the lobby DB (accounts, characters, items, match log). `bundled` compiles the
# public-domain SQLite amalgamation so no system library is needed; MIT licence.
rusqlite = { version = "0.32", features = ["bundled"] }
# CLEANROOM.md 4a: command-line parsing with exactly the flags of specs/LOBBY_HARNESS.md section 1
# (argparse-compatible `--flag value` / `--flag=value`, unknown flag = exit 2); MIT OR Apache-2.0.
clap = { version = "4", default-features = false, features = ["std", "help", "usage", "error-context"] }
# CLEANROOM.md 4a: Argon2id password hashing for accounts (LG-140; RustCrypto `argon2`, raw hash only: the PHC string
# is written and parsed in src/pwhash.rs). No `rand` feature: salts come from the lobby's own key source.
# MIT OR Apache-2.0.
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
# CLEANROOM.md 4a: TLS on the auth and web ports (LG-220..226, our own deviation from 2009: the 2009 auth protocol
# carries the password in clear). rustls (Apache-2.0 OR ISC OR MIT) with the `ring` provider (Apache-2.0 AND ISC; no
# cmake / nasm needed under MSVC, unlike aws-lc-rs), TLS 1.3 only (both ends are ours, browsers speak it), synchronous
# `ServerConnection` driven by our own threads (src/tls.rs).
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
# CLEANROOM.md 4a: the self-signed certificate + key the lobby makes on its first start (LG-221); MIT OR Apache-2.0.
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem", "crypto"] }
# CLEANROOM.md 4a: the password-recovery mail (LG-240..LG-245) over SMTP: STARTTLS on 587, implicit TLS on 465.
# lettre (MIT) with its blocking SMTP transport on our own worker thread (no async runtime), rustls + ring (already in
# the lock through the TLS ports) and the OS root store through rustls-native-certs (as the client); no native-tls.
# New in the lock through it: idna + the icu_* crates (Unicode-3.0, permissive), url, nom, mime, hostname (MIT/Apache).
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "hostname", "rustls", "ring", "rustls-native-certs"] }
# CLEANROOM.md 4a: Ed25519 identity tokens (LG-68): the same `ring` (Apache-2.0 AND ISC) rustls already pulls in for
# TLS, named here for `ring::signature`; no new crate in the lock.
ring = "0.17"
# CLEANROOM.md 4a: the diagnostic reports (LG-360): inflates the uploaded gzip document with a hard size cap; MIT OR
# Apache-2.0 (already in the lock through other crates).
flate2 = "1"
# CLEANROOM.md 4a: the diagnostic reports (LG-360): reads the report's JSON meta keys; MIT OR Apache-2.0 (already in the
# lock through dc-rom).
serde_json = "1"
# CLEANROOM.md 4a: the admin web sign-in (LG-383): reads the x5c certificates of a security key's packed attestation
# (names, validity, basic constraints, key usage, the FIDO AAGUID extension). No `verify` feature: every signature of
# the chain is checked with `ring` in src/webauthn.rs. Pure Rust, no OpenSSL; MIT OR Apache-2.0.
x509-parser = { version = "0.17", default-features = false }
# Wave G config wiring: server.toml layer (schema, env overrides, check) and the mod-set pack for the advertised set.
dc-config = { path = "../dc-config" }
dc-modkit = { path = "../dc-modkit" }

# CLEANROOM.md 4a: the console Ctrl+C / Ctrl+Break / close handler of the graceful stop (LG-130) through the Win32
# API (windows-sys 0.59 is already in the lock through dc-hangdump and the wgpu / winit stack); MIT OR Apache-2.0.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Console"] }

# CLEANROOM.md 4a: SIGINT / SIGTERM for the graceful stop on unix (libc is already in the lock); MIT OR Apache-2.0.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# tests/e2e_dserver.rs only: the synthetic UDP client of dc-dserver (`synth_client`) joins the real dc-dserver
# binary the lobby launched, so the match reaches `@player` / `@result`. The lobby itself never links it.
dc-dserver = { path = "../dc-dserver" }
# tests/e2e_dserver.rs: the receive thread for its UDP sockets (a socket read timeout loses datagrams on Windows)
dc-net-engine = { path = "../dc-net-engine" }
# tests/login_burst.rs: connections from many loopback source addresses
socket2 = "0.6"
# the schema-coverage test walks the config key tree
toml = "0.8"
