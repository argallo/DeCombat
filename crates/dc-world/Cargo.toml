[package]
name = "dc-world"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Reader for version-85 world files (.dat) of the 2009 client, written from rust/specs/FMT_DAT85.md"

[dependencies]
# dc-core: its SHA-256, used to identify class/property names by hash (FMT_DAT85.md 6.2) and to pin the worlds a
# composed map is built from (MAP-116).
dc-core = { path = "../dc-core" }
# dc-vfs: the composer reads the pieces of a map through the caller's file system at load time (MAP-116); the
# apps pass one whose archive layer is the user's ROM.
dc-vfs = { path = "../dc-vfs" }

[dev-dependencies]
# dc-rez / dc-rom: the ROM-gated tests and the stats example read the user's own world archive at run time.
dc-rez = { path = "../dc-rez" }
dc-rom = { path = "../dc-rom" }
