[package]
name = "dc-cone"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The 2009 shot cone shared by the DeCombat client, server and bot: the random table (ROM entry or its generator), the shot counter, the row bounds, half-width, pellet direction and its inverse, in binary32"

[dependencies]
# dc-attr: parses the attribute entries (the random table, the weapon and mod rows' cone keys) at run time.
dc-attr = { path = "../dc-attr" }
# dc-vfs: the caller's file system the table entry is read through (the user's ROM); dc-core: SHA-256 of the table.
dc-vfs = { path = "../dc-vfs" }
dc-core = { path = "../dc-core" }
# dc-sim (no default features: only the control-word bit names): ANY_MOVE / RUN of the movement factor choice.
dc-sim = { path = "../dc-sim", default-features = false }

[dev-dependencies]
# dc-rez: the ROM-gated test opens the user's own archive (its random table entry).
dc-rez = { path = "../dc-rez" }
