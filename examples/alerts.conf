# /opt/decombat/config/alerts.conf: tools/vps/healthcheck.sh and backup.sh (OPS-21, docs/OPS.md). Root only (0640 root:root): the
# webhook address is a secret. KEY=VALUE; read, never sourced.

# Discord: Server settings > Integrations > Webhooks > Copy URL. Anything taking {"content": "..."} works.
#WEBHOOK_URL=https://discord.com/api/webhooks/...
# And/or a mail to these addresses (comma separated), sent through the default lobby's own [mail] settings
# (server.toml, password DC_MAIL__PASSWORD of decombat.env): no other account needed. It counts toward the mail budget.
#EMAIL_TO=you@example.com

# A dead-man service (for example healthchecks.io) fetched at every run: it tells you when the runs stop, whole box included.
#PING_URL=https://hc-ping.com/...

# The name in the messages; default the host name.
#LABEL=US Central

# Runs in a row before a failure is told (2 runs = about 4 minutes; a deploy's restart stays quiet).
FAIL_AFTER=2
DISK_MAX_PCT=90
# Age of the last finished backup; 0 = no check (no backups yet).
BACKUP_MAX_HOURS=30
BACKUP_DIR=/opt/decombat/backups
# The lobby's operator monitor (MON-5, docs/OPS.md section 15): within OPS_WINDOW_MIN minutes, a match with OPS_SILENT_DROPS or
# more players dropped silently, OPS_ERRORS problem events (refusals, drops, lobby errors), OPS_CRASHES game servers crashed or
# failed to start; and every game host on the lobby's build. 0 turns one off. A lobby older than the monitor skips these.
OPS_WINDOW_MIN=10
OPS_SILENT_DROPS=3
OPS_ERRORS=30
OPS_CRASHES=2
# Game host agents (space separated) whose absence is no alarm, for example a host at home.
#HOSTS_OPTIONAL=us-west
