# /opt/decombat/config/backup.conf: tools/vps/backup.sh and restore.sh (OPS-20, docs/OPS.md). Root only (0640 root:root).
# KEY=VALUE; read, never sourced. Nothing here can decrypt a backup: only the PUBLIC key goes on the VPS.

# One of the two. age: the output of `age-keygen -y`, a line starting age1. gpg: a file made with `gpg --export --armor`.
#AGE_RECIPIENT=age1...
#GPG_RECIPIENT_FILE=/opt/decombat/config/backup-public.asc

# Where the backups go: an rclone remote and folder, set up with `sudo rclone config --config /opt/decombat/config/rclone.conf`.
#RCLONE_REMOTE=offsite:decombat-backups
RCLONE_CONFIG=/opt/decombat/config/rclone.conf

# Backups kept here; age in days of what is deleted on the remote (0 = nothing is deleted there).
KEEP=14
KEEP_REMOTE_DAYS=60

BACKUP_DIR=/opt/decombat/backups
# 1 = the TLS and identity keys are in the (always encrypted) archive. Losing the TLS key changes the fingerprint every client
# pins; losing the identity key ends every token. 0 leaves them out.
INCLUDE_KEYS=1
# 1 = no remote is fine. A backup on the same disk does not survive the VPS: for a test only.
LOCAL_ONLY=0
