# systemd drop-in: <unit>.d/10-hardening.conf for decombat-lobby, decombat-lobby@ and decombat-bots (OPS-22, docs/OPS.md).
# The units run as the system user `decombat` already; this takes away what the lobby and its game servers never need. Each
# unit's own ReadWritePaths stays the only place it can write. NOT RUN ON A LINUX VPS YET: installed by
# tools/vps/bootstrap.sh and tools/vps/migrate_nonroot.sh harden. To undo: delete this file, systemctl daemon-reload,
# restart the unit. After installing, start a match: the game server children run under the same limits.
[Service]
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
NoNewPrivileges=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictSUIDSGID=yes
RestrictRealtime=yes
RestrictNamespaces=yes
LockPersonality=yes
MemoryDenyWriteExecute=yes
SystemCallArchitectures=native
SystemCallFilter=@system-service
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
CapabilityBoundingSet=
AmbientCapabilities=
UMask=0027
