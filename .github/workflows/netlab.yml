name: netlab

# The network lab (docs/NETLAB.md) without the ROM: nightly and by hand. CI never has a ROM, so the matches here run
# on a synthetic world: a dc-dserver started by dc-netlab, headless dc-botclient players joining it directly, each on
# its own impaired path (loss bursts, latency, jitter, blackouts, a campus firewall...). The transport and the session
# are the real ones; the ROM run (every mode on real maps through a lobby) is a local / beta-server step:
# `dc-netlab quick --rom <dir>`.
on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:
    inputs:
      matrix:
        description: "matrix (ci | quick | campus); without a ROM every scenario runs on the synthetic world"
        default: ci
      players:
        description: "bots per room (1-16)"
        default: "8"
      minutes:
        description: "minutes per scenario (empty: the matrix's own)"
        default: ""

permissions:
  contents: read

concurrency:
  group: netlab-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CA_ROM: ""

jobs:
  netlab:
    name: network lab (no ROM)
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --target x86_64-unknown-linux-gnu && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      # the simulated paths: the transport state machine over seeded lossy / reordering / small-MTU channels, and the
      # impairment model itself
      - name: transport tests (simulated paths)
        run: cargo test -p dc-net-engine -p dc-netlab
      - name: build
        run: cargo build --release -p dc-netlab -p dc-dserver -p dc-botclient
      - name: network lab
        env:
          MATRIX: ${{ github.event.inputs.matrix || 'ci' }}
          PLAYERS: ${{ github.event.inputs.players || '8' }}
          MINUTES: ${{ github.event.inputs.minutes || '' }}
        run: |
          set -eu
          extra=""
          if [ -n "$MINUTES" ]; then extra="--minutes $MINUTES"; fi
          target/release/dc-netlab "$MATRIX" --direct --players "$PLAYERS" --out netlab-out $extra
      - name: report
        if: always()
        run: cat netlab-out/report.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: netlab-report
          path: netlab-out
          retention-days: 14
