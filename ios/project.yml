# The iPad app wrapper (xcodegen: `xcodegen generate --spec ios/project.yml`; tools/ios_run.sh does it). The app is a
# thin UIKit shell: main.m calls dc_ios_main() from the Rust static library crates/dc-ios-app (built by cargo for
# aarch64-apple-ios, or aarch64-apple-ios-sim for the simulator) which runs dc-client's iOS driver. Signing: automatic
# provisioning with the team tools/ios_run.sh passes (DEVELOPMENT_TEAM on the xcodebuild line, never in this file; a free
# Apple ID's app stays installed 7 days, re-run the script to renew). tools/ios_release.sh signs a release by hand or
# not at all. No xcodeVersion here on purpose: the project opens with whatever Xcode the machine has.
name: DeCombat
options:
  bundleIdPrefix: org.decombat
  deploymentTarget:
    iOS: "17.0"
  generateEmptyDirectories: true
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "2"
    ENABLE_BITCODE: NO
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    # the Rust library is arm64 only (device and the simulator on Apple Silicon)
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: NO
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
targets:
  DeCombat:
    type: application
    platform: iOS
    sources:
      - path: main.m
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.decombat.client
        PRODUCT_NAME: DeCombat
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        # the Rust static library: RUST_LIB_DIR is passed by tools/ios_run.sh and ios_release.sh (target/<triple>/release)
        LIBRARY_SEARCH_PATHS: "$(RUST_LIB_DIR)"
        OTHER_LDFLAGS: "-ldc_ios_app -lc++ -lresolv"
        CLANG_ENABLE_OBJC_ARC: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - sdk: UIKit.framework
      - sdk: Foundation.framework
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: CoreGraphics.framework
      - sdk: GameController.framework
      - sdk: AudioToolbox.framework
      - sdk: CoreAudio.framework
      - sdk: AVFoundation.framework
      - sdk: Security.framework
      - sdk: CoreFoundation.framework
